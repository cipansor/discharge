[package]
name = "verif-arithmetic"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Integer primitives for safety-critical Rust whose central properties are proved inside the crate by exhaustive enumeration: checked and saturating arithmetic, overflow-free mul_div, Q16.16 fixed point, and a refinement-typed Bounded. no_std, zero dependencies."
license = "Apache-2.0"
repository = "https://github.com/cipansor/verif"
homepage = "https://github.com/cipansor/verif"
documentation = "https://docs.rs/verif-arithmetic"
authors = ["Yayasan Pesantren Cipansor and contributors <halo@cipansor.or.id>"]
readme = "README.md"
keywords = ["no_std", "safety-critical", "fixed-point", "checked-arithmetic", "formal-verification"]
categories = ["no-std", "no-std::no-alloc", "embedded"]
# Compiled output the oracle runs leave behind; excluded from the `.crate` for the same
# reason as the parent's (see `Cargo.toml` at the repository root).
exclude = ["*.rlib", "target/", ".sweep/"]

# No features at all. The crate is `no_std` and zero-dependency unconditionally;
# there is nothing to turn on. The `smt` engine that cross-checks these proofs is
# an *oracle* and lives in the parent `verif` crate, which depends on this one
# and not the other way round -- so a build of this crate links `core` and nothing
# else, which is the property the parent's gate 4 enforces.
[features]
default = []

# No docs.rs configuration is needed *and* none is possible: with no features and
# no `cfg`-gated items, the default build is the whole surface, so there is no
# "silently smaller published docs" failure to prevent here. The parent crate
# does need `all-features = true` (its `mir` frontend is `std`-gated); this one
# would only be adding a flag with no reader.
#
# Recorded as a comment rather than an empty `[package.metadata.docs.rs]` table,
# because an empty table is indistinguishable from one someone meant to fill in.
