[workspace]
# `discharge` and the proved-arithmetic sibling. The `tools/mir-oracle` crate is
# deliberately *not* a member: it links rustc internals behind
# `#![feature(rustc_private)]`, so it builds only on a nightly with `rustc-dev`.
# Making it a member would make `cargo build --workspace` require a nightly, which
# is exactly what a stable, zero-dependency crate must not do. It is built by name
# (`cargo build -p mir-oracle`) with the oracle toolchain, and `exclude` keeps
# cargo from trying to pull it in through the `tools/` glob.
members = ["discharge-arithmetic"]
exclude = ["tools/mir-oracle"]
resolver = "2"

[package]
name = "discharge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "In-code formal verification for Rust: an embedded bit-blasting SMT decision procedure, a symbolic DSL, contracts and a machine-checked proof kernel. SPARK-inspired, no_std, no external dependencies."
authors = ["Yayasan Pesantren Cipansor and contributors <halo@cipansor.or.id>"]
license = "Apache-2.0"
keywords = ["formal-verification", "smt", "no_std", "safety-critical", "contracts"]
categories = ["no-std", "embedded", "development-tools::testing"]

[dependencies]
# The only dependency, and it is a sibling in this repository, not a registry
# crate: the proved integer primitives, which are `no_std`, `#![forbid(unsafe_code)]`
# and dependency-free themselves. The point of the split is that the *runtime*
# arithmetic a safety build ships links `core` and nothing else, while this crate
# keeps the symbolic `smt` engine that cross-checks those proofs. Gate 4 of
# `scripts/gate.sh` enforces that no *external* crate ever joins this list.
discharge-arithmetic = { path = "discharge-arithmetic" }

[features]
# No default features: the crate is `no_std` + zero-dependency out of the box,
# which is what a bare-metal safety build wants. `std` only adds the thread-local
# arena used by the host-side test suite.
default = []
std = []

# `examples/bare_metal.rs` is `#![no_std]` and has no `main`, so it cannot be a normal
# binary example -- `cargo` would look for a `main` on a target that has no runtime to
# start one. Building it as a library example is what lets the *qualified* toolchain
# compile the decision procedure for `thumbv7em-none-eabihf` (see
# `tools/ferrocene/run.sh`), which is the whole point of the file: the prover is code in
# the artifact, so it has to build for the artifact's target. `cargo test --example
# bare_metal` still runs its `#[cfg(test)]` module on the host.
[[example]]
name = "bare_metal"
crate-type = ["lib"]
# Examples are not tested by default, so its host-side verdict tests would be built and
# then ignored -- exactly the "gate that silently did not run" this repository keeps
# finding. `test = true` makes `cargo test --workspace --features std` execute them and
# count them.
test = true

[profile.release]
opt-level = 2

# The exhaustive enumerations in `discharge-arithmetic`'s proofs are tight integer
# loops, and an unoptimised build runs them roughly eight times slower than
# `prove::ENUM_BUDGET`'s comment assumes. A `2^32` walk costs ~21 s in the default
# test profile and ~2.6 s with `opt-level = 2`, which is the difference between a
# gate that stalls on one obligation and one that finishes the suite.
#
# `debug-assertions` and `overflow-checks` are left **on** deliberately. This is an
# arithmetic crate: the tests that exercise `checked_*` and `saturating_*` are
# exactly where a silent wrap would hide, so the speed must not be bought by
# turning off the checks that would catch it. Optimising while keeping them on is
# the trade that costs nothing.
[profile.test]
opt-level = 2
